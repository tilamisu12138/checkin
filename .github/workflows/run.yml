name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '45 16 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}

  keepalive:
    # 定时运行或手动运行时检查是否需要保活
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 仓库超过30天无提交时自动保活
        run: |
          last_commit=$(git log -1 --format=%ct)
          current_time=$(date +%s)
          inactive_seconds=$((current_time - last_commit))

          if [ "$inactive_seconds" -ge 2592000 ]; then
            date -u > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keep workflow active"
            git push
          else
            echo "最近30天内有提交，无需保活"
          fi
